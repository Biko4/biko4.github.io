端的收藏、个人赞念和设置。</li><li>与您账户关联的通知标识符。</li></ul>\n<h2>可能保留的内容</h2>\n<p>购买记录由 Google Play 按其政策保留。删除后我们不保留任何数据。</p>\n<h2>时限</h2>\n<p>我们会在收到请求后 30 天内删除数据。卸载应用时，保存在设备上的数据会被删除。</p>\n<p><a href=\"privacy.html\">隐私政策</a></p>"}, "tr": {"title": "Hesabınızı ve verilerinizi silin", "app": "«Zikirler ve Ezan» uygulaması", "updated": "Son güncelleme: 15 Kasım 2026", "body": "<p>Bu sayfa, BikoApps'in «Zikirler ve Ezan» (com.biko.athkar) uygulamasının kullanıcıları içindir.</p>\n<h2>Yöntem 1: Uygulama içinden</h2>\n<ol><li>Uygulamayı açın ve giriş yapın.</li><li>Hesap sayfasına gidin.</li><li>«Hesabı sil» seçeneğine dokunun ve onaylayın.</li></ol>\n<h2>Yöntem 2: E-posta ile</h2>\n<p>Hesabınıza bağlı e-posta adresinden <a href=\"mailto:biko.dev.app@gmail.com\">biko.dev.app@gmail.com</a> adresine «Hesabı sil» konulu bir e-posta gönderin. Silme işlemini yanıtla onaylarız.</p>\n<h2>Neler silinir</h2>\n<ul><li>Hesabınız (ad, e-posta ve kullanıcı kimliği).</li><li>Bulutta saklanan favoriler, kişisel zikirler ve ayarlar.</li><li>Hesabınıza bağlı bildirim tanımlayıcısı.</li></ul>\n<h2>Neler kalabilir</h2>\n<p>Satın alma kayıtları Google Play tarafından kendi politikasına göre saklanır. Silme işleminden sonra biz hiçbir veri saklamayız.</p>\n<h2>Süre</h2>\n<p>Verileri talepten itibaren 30 gün içinde sileriz. Cihazınızdaki veriler uygulamayı kaldırdığınızda silinir.</p>\n<p><a href=\"privacy.html\">Gizlilik Politikası</a></p>"}};
const ORDER = ["ar", "en", "ur", "bn", "hi", "zh", "tr"];
const NAMES = {"ar": "العربية", "en": "English", "ur": "اردو", "bn": "বাংলা", "hi": "हिन्दी", "zh": "中文", "tr": "Türkçe"};
const DIRS = {"ar": "rtl", "en": "ltr", "ur": "rtl", "bn": "ltr", "hi": "ltr", "zh": "ltr", "tr": "ltr"};
function pick(){
  const q = new URLSearchParams(location.search).get('lang');
  if (q && DATA[q]) return q;
  let s=null; try{ s = localStorage.getItem('athkar_lang'); }catch(e){}
  if (s && DATA[s]) return s;
  const n = (navigator.language||'ar').slice(0,2).toLowerCase();
  return DATA[n] ? n : 'ar';
}
function render(l){
  const d = DATA[l];
  document.documentElement.lang = l;
  document.documentElement.dir = DIRS[l];
  document.title = d.title + ' – ' + d.app;
  document.getElementById('doc').innerHTML = '<h1>'+d.title+'</h1><p class="sub">'+d.app+' · '+d.updated+'</p>'+d.body;
  document.querySelectorAll('#langs button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.l===l));
  try{ localStorage.setItem('athkar_lang', l); }catch(e){}
  const u = new URL(location.href); u.searchParams.set('lang', l); history.replaceState(null,'',u);
}
const nav = document.getElementById('langs');
ORDER.forEach(l=>{ const b=document.createElement('button'); b.dataset.l=l; b.textContent=NAMES[l]; b.onclick=()=>render(l); nav.appendChild(b); });
render(pick());
</script>
<noscript><h1>حذف الحساب والبيانات</h1><p>هذه الصفحة لمستخدمي تطبيق «اذكر الله - أذكار وأذان» (com.biko.athkar) من BikoApps.</p>
<h2>الطريقة ١: من داخل التطبيق</h2>
<ol><li>افتح التطبيق وسجّل الدخول.</li><li>ادخل على صفحة الحساب.</li><li>اختر «حذف الحساب» وأكّد.</li></ol>
<h2>الطريقة ٢: بالبريد الإلكتروني</h2>
<p>أرسل رسالة إلى <a href="mailto:biko.dev.app@gmail.com">biko.dev.app@gmail.com</a> من نفس البريد المرتبط بحسابك، وعنوانها «حذف الحساب». سنؤكد لك الحذف بالرد.</p>
<h2>ما الذي يُحذف</h2>
<ul><li>حسابك (الاسم والبريد ومعرّف المستخدم).</li><li>المفضلة والأذكار الخاصة والإعدادات المحفوظة في السحابة.</li><li>معرّف الإشعارات المرتبط بحسابك.</li></ul>
<h2>ما الذي قد يبقى</h2>
<p>سجلات المشتريات تحتفظ بها Google Play وفق سياستها، ولا نحتفظ نحن بأي بيانات بعد الحذف.</p>
<h2>المدة</h2>
<p>نحذف البيانات خلال 30 يوماً من الطلب. والبيانات المحفوظة على جهازك تُحذف عند حذف التطبيق.</p>
<p><a href="privacy.html">سياسة الخصوصية</a></p><hr><h1>Delete your account and data</h1><p>This page is for users of “Athkar & Adhan” (com.biko.athkar) by BikoApps.</p>
<h2>Option 1: In the app</h2>
<ol><li>Open the app and sign in.</li><li>Go to the Account page.</li><li>Tap “Delete account” and confirm.</li></ol>
<h2>Option 2: By email</h2>
<p>Send an email to <a href="mailto:biko.dev.app@gmail.com">biko.dev.app@gmail.com</a> from the email address linked to your account, with the subject “Delete account”. We will reply to confirm the deletion.</p>
<h2>What is deleted</h2>
<ul><li>Your account (name, email and user ID).</li><li>Favorites, personal athkar and settings stored in the cloud.</li><li>The notification identifier linked to your account.</li></ul>
<h2>What may be kept</h2>
<p>Purchase records are kept by Google Play under its own policy. We keep no data after deletion.</p>
<h2>Timeframe</h2>
<p>We delete the data within 30 days of the request. Data stored on your device is removed when you uninstall the app.</p>
<p><a href="privacy.html">Privacy Policy</a></p></noscript>
