const DATA = {"ar": {"title": "سياسة الخصوصية", "app": "تطبيق «اذكر الله - أذكار وأذان»", "updated": "آخر تحديث: 15 نوفمبر 2026", "body": "<p>توضّح هذه السياسة كيف يتعامل تطبيق «اذكر الله - أذكار وأذان» (com.biko.athkar)، من تطوير BikoApps، مع بياناتك. يعمل التطبيق دون حساب، ومحتوى الأذكار ومواقيت الصلاة متاحان دون اتصال بالإنترنت.</p>\n<h2>البيانات التي نتعامل معها</h2>\n<ul>\n<li><b>الحساب (اختياري):</b> إذا سجّلت الدخول بحساب Google أو بالبريد الإلكتروني، نحفظ اسمك وبريدك ومعرّف المستخدم عبر Firebase Authentication، لمزامنة مفضلتك وأذكارك الخاصة بين أجهزتك.</li>\n<li><b>المحتوى الذي تنشئه:</b> المفضلة والأذكار الخاصة والإعدادات تُحفظ على جهازك، وإذا سجّلت الدخول تُزامن مع Firebase Cloud Firestore.</li>\n<li><b>الإشعارات:</b> نستخدم Firebase Cloud Messaging لإرسال التذكيرات والتنبيهات، ويتطلب ذلك معرّفاً خاصاً بجهازك للإشعارات.</li>\n<li><b>الموقع:</b> يُستخدم موقعك التقريبي على جهازك فقط لحساب مواقيت الصلاة واتجاه القبلة، ولا نرسله إلى خوادمنا. وقد تستخدم خدمة الموقع في جهازك خدمات Google لتحويل الإحداثيات إلى اسم المدينة.</li>\n<li><b>الإعلانات:</b> يعرض التطبيق إعلانات عبر Google AdMob، وقد تجمع AdMob معرّف الإعلانات وعنوان IP ومعلومات الجهاز والتفاعل مع الإعلانات لعرضها وقياسها. راجع <a href=\"https://policies.google.com/technologies/ads\">سياسة Google للإعلانات</a>.</li>\n<li><b>المشتريات:</b> تتم عبر Google Play، ولا نستلم أي بيانات دفع أو بطاقات.</li>\n<li><b>أصوات الأذان:</b> تُنزَّل الأصوات الإضافية من GitHub، وقد يسجّل GitHub عنوان IP عند التنزيل.</li>\n</ul>\n<h2>المشاركة</h2>\n<p>لا نبيع بياناتك. نشاركها فقط مع مزوّدي الخدمات المذكورين أعلاه (Google Firebase وGoogle AdMob وGoogle Play وGitHub) بالقدر اللازم لتشغيل التطبيق.</p>\n<h2>الأمان</h2>\n<p>تُنقل البيانات مشفّرة عبر اتصال آمن (HTTPS).</p>\n<h2>حذف بياناتك</h2>\n<p>يمكنك حذف حسابك وبياناتك من داخل التطبيق، أو بطلب عبر صفحة <a href=\"delete.html\">حذف الحساب</a>. ونحذف البيانات خلال 30 يوماً من الطلب. وحذف التطبيق من جهازك يحذف البيانات المحفوظة عليه.</p>\n<h2>الأطفال</h2>\n<p>التطبيق غير موجّه للأطفال دون 13 عاماً، ولا نجمع بياناتهم عن قصد.</p>\n<h2>التغييرات</h2>\n<p>قد نحدّث هذه السياسة، وننشر أي تغيير في هذه الصفحة مع تاريخ التحديث.</p>\n<h2>التواصل</h2>\n<p>لأي سؤال: <a href=\"mailto:biko.dev.app@gmail.com\">biko.dev.app@gmail.com</a></p>"}, "en": {"title": "Privacy Policy", "app": "Athkar & Adhan app", "updated": "Last updated: November 15, 2026", "body": "<p>This policy explains how the app “Athkar & Adhan” (com.biko.athkar), developed by BikoApps, handles your data. The app works without an account, and the athkar content and prayer times are available offline.</p>\n<h2>Data we handle</h2>\n<ul>\n<li><b>Account (optional):</b> If you sign in with Google or email, we store your name, email address and user ID through Firebase Authentication to sync your favorites and personal athkar across your devices.</li>\n<li><b>Content you create:</b> Favorites, personal athkar and settings are stored on your device and, if you sign in, synced with Firebase Cloud Firestore.</li>\n<li><b>Notifications:</b> We use Firebase Cloud Messaging to send reminders and announcements, which requires a notification identifier for your device.</li>\n<li><b>Location:</b> Your approximate location is used on your device only, to calculate prayer times and the Qibla direction. We do not send it to our servers. Your device’s location service may use Google services to turn coordinates into a city name.</li>\n<li><b>Ads:</b> The app shows ads through Google AdMob, which may collect the advertising ID, IP address, device information and ad interactions to serve and measure ads. See <a href=\"https://policies.google.com/technologies/ads\">Google’s advertising policy</a>.</li>\n<li><b>Purchases:</b> Handled by Google Play. We never receive payment or card details.</li>\n<li><b>Adhan sounds:</b> Extra sounds are downloaded from GitHub, which may log your IP address.</li>\n</ul>\n<h2>Sharing</h2>\n<p>We do not sell your data. We share it only with the service providers listed above (Google Firebase, Google AdMob, Google Play and GitHub), as needed to run the app.</p>\n<h2>Security</h2>\n<p>Data is encrypted in transit (HTTPS).</p>\n<h2>Deleting your data</h2>\n<p>You can delete your account and data inside the app, or request it on the <a href=\"delete.html\">account deletion page</a>. We delete the data within 30 days of the request. Uninstalling the app removes the data stored on your device.</p>\n<h2>Children</h2>\n<p>The app is not directed at children under 13, and we do not knowingly collect their data.</p>\n<h2>Changes</h2>\n<p>We may update this policy and will post any change on this page with the update date.</p>\n<h2>Contact</h2>\n<p>Questions: <a href=\"mailto:biko.dev.app@gmail.com\">biko.dev.app@gmail.com</a></p>"}, "ur": {"title": "رازداری کی پالیسی", "app": "ایپ «اذکار اور اذان»", "updated": "آخری تازہ کاری: 15 نومبر 2026", "body": "<p>یہ پالیسی بتاتی ہے کہ ایپ «اذکار اور اذان» (com.biko.athkar)، جسے BikoApps نے بنایا ہے، آپ کے ڈیٹا کو کیسے سنبھالتی ہے۔ ایپ اکاؤنٹ کے بغیر کام کرتی ہے، اور اذکار اور نماز کے اوقات انٹرنیٹ کے بغیر دستیاب ہیں۔</p>\n<h2>وہ ڈیٹا جسے ہم استعمال کرتے ہیں</h2>\n<ul>\n<li><b>اکاؤنٹ (اختیاری):</b> اگر آپ Google یا ای میل سے سائن ان کریں تو ہم Firebase Authentication کے ذریعے آپ کا نام، ای میل اور یوزر آئی ڈی محفوظ کرتے ہیں تاکہ آپ کے پسندیدہ اور ذاتی اذکار آپ کے آلات میں ہم آہنگ رہیں۔</li>\n<li><b>آپ کا بنایا ہوا مواد:</b> پسندیدہ، ذاتی اذکار اور ترتیبات آپ کے آلے پر محفوظ ہوتی ہیں، اور سائن ان کی صورت میں Firebase Cloud Firestore کے ساتھ ہم آہنگ ہوتی ہیں۔</li>\n<li><b>اطلاعات:</b> یاد دہانیاں بھیجنے کے لیے ہم Firebase Cloud Messaging استعمال کرتے ہیں، جس کے لیے آپ کے آلے کا اطلاعاتی شناخت کار درکار ہے۔</li>\n<li><b>مقام:</b> آپ کا تخمینی مقام صرف آپ کے آلے پر نماز کے اوقات اور قبلہ کی سمت معلوم کرنے کے لیے استعمال ہوتا ہے، ہم اسے اپنے سرورز پر نہیں بھیجتے۔ آپ کے آلے کی مقام سروس شہر کا نام جاننے کے لیے Google کی خدمات استعمال کر سکتی ہے۔</li>\n<li><b>اشتہارات:</b> ایپ Google AdMob کے ذریعے اشتہارات دکھاتی ہے، جو اشتہارات دکھانے اور ناپنے کے لیے اشتہاری آئی ڈی، IP ایڈریس، آلے کی معلومات اور اشتہار سے تعامل جمع کر سکتا ہے۔ دیکھیں <a href=\"https://policies.google.com/technologies/ads\">Google کی اشتہاری پالیسی</a>۔</li>\n<li><b>خریداری:</b> Google Play کے ذریعے ہوتی ہے، ہمیں ادائیگی یا کارڈ کی معلومات نہیں ملتیں۔</li>\n<li><b>اذان کی آوازیں:</b> اضافی آوازیں GitHub سے ڈاؤن لوڈ ہوتی ہیں، جو آپ کا IP ایڈریس ریکارڈ کر سکتا ہے۔</li>\n</ul>\n<h2>شراکت</h2>\n<p>ہم آپ کا ڈیٹا فروخت نہیں کرتے۔ ہم اسے صرف اوپر بیان کردہ خدمات فراہم کنندگان (Google Firebase، Google AdMob، Google Play اور GitHub) کے ساتھ، ایپ چلانے کی حد تک شیئر کرتے ہیں۔</p>\n<h2>حفاظت</h2>\n<p>ڈیٹا منتقلی کے دوران خفیہ (HTTPS) ہوتا ہے۔</p>\n<h2>اپنا ڈیٹا حذف کرنا</h2>\n<p>آپ ایپ کے اندر سے اپنا اکاؤنٹ اور ڈیٹا حذف کر سکتے ہیں، یا <a href=\"delete.html\">اکاؤنٹ حذف کرنے کے صفحے</a> سے درخواست دے سکتے ہیں۔ ہم درخواست کے 30 دن کے اندر ڈیٹا حذف کر دیتے ہیں۔ ایپ اَن انسٹال کرنے سے آلے پر محفوظ ڈیٹا ختم ہو جاتا ہے۔</p>\n<h2>بچے</h2>\n<p>یہ ایپ 13 سال سے کم عمر بچوں کے لیے نہیں ہے، اور ہم جان بوجھ کر ان کا ڈیٹا جمع نہیں کرتے۔</p>\n<h2>تبدیلیاں</h2>\n<p>ہم اس پالیسی کو اپ ڈیٹ کر سکتے ہیں اور ہر تبدیلی تاریخ کے ساتھ اسی صفحے پر شائع کریں گے۔</p>\n<h2>رابطہ</h2>\n<p>سوالات کے لیے: <a href=\"mailto:biko.dev.app@gmail.com\">biko.dev.app@gmail.com</a></p>"}, "bn": {"title": "গোপনীয়তা নীতি", "app": "«আযকার ও আযান» অ্যাপ", "updated": "সর্বশেষ হালনাগাদ: ১৫ নভেম্বর ২০২৬", "body": "<p>এই নীতিতে ব্যাখ্যা করা হয়েছে যে BikoApps-এর তৈরি «আযকার ও আযান» (com.biko.athkar) অ্যাপ আপনার তথ্য কীভাবে ব্যবহার করে। অ্যাপটি অ্যাকাউন্ট ছাড়াই চলে, এবং আযকার ও নামাজের সময়সূচি ইন্টারনেট ছাড়াই পাওয়া যায়।</p>\n<h2>যে তথ্য আমরা ব্যবহার করি</h2>\n<ul>\n<li><b>অ্যাকাউন্ট (ঐচ্ছিক):</b> Google বা ইমেইল দিয়ে সাইন ইন করলে, আপনার প্রিয় ও ব্যক্তিগত আযকার আপনার ডিভাইসগুলোর মধ্যে সিঙ্ক করার জন্য Firebase Authentication-এর মাধ্যমে আপনার নাম, ইমেইল ও ইউজার আইডি সংরক্ষণ করি।</li>\n<li><b>আপনার তৈরি কনটেন্ট:</b> প্রিয়, ব্যক্তিগত আযকার ও সেটিংস আপনার ডিভাইসে সংরক্ষিত থাকে, এবং সাইন ইন করলে Firebase Cloud Firestore-এর সাথে সিঙ্ক হয়।</li>\n<li><b>নোটিফিকেশন:</b> রিমাইন্ডার ও ঘোষণা পাঠাতে আমরা Firebase Cloud Messaging ব্যবহার করি, এর জন্য আপনার ডিভাইসের একটি নোটিফিকেশন শনাক্তকারী প্রয়োজন।</li>\n<li><b>অবস্থান:</b> আপনার আনুমানিক অবস্থান শুধু আপনার ডিভাইসে নামাজের সময় ও কিবলার দিক নির্ণয়ে ব্যবহৃত হয়, আমরা এটি আমাদের সার্ভারে পাঠাই না। শহরের নাম বের করতে আপনার ডিভাইসের লোকেশন সেবা Google-এর সেবা ব্যবহার করতে পারে।</li>\n<li><b>বিজ্ঞাপন:</b> অ্যাপটি Google AdMob-এর মাধ্যমে বিজ্ঞাপন দেখায়, যা বিজ্ঞাপন দেখানো ও পরিমাপের জন্য বিজ্ঞাপন আইডি, IP ঠিকানা, ডিভাইসের তথ্য ও বিজ্ঞাপনের সাথে মিথস্ক্রিয়া সংগ্রহ করতে পারে। দেখুন <a href=\"https://policies.google.com/technologies/ads\">Google-এর বিজ্ঞাপন নীতি</a>।</li>\n<li><b>ক্রয়:</b> Google Play-এর মাধ্যমে হয়, আমরা কোনো পেমেন্ট বা কার্ডের তথ্য পাই না।</li>\n<li><b>আযানের শব্দ:</b> অতিরিক্ত শব্দ GitHub থেকে ডাউনলোড হয়, যা আপনার IP ঠিকানা লগ করতে পারে।</li>\n</ul>\n<h2>শেয়ার করা</h2>\n<p>আমরা আপনার তথ্য বিক্রি করি না। অ্যাপ চালানোর প্রয়োজন অনুযায়ী শুধু উপরে উল্লেখিত সেবাদাতাদের (Google Firebase, Google AdMob, Google Play ও GitHub) সাথে শেয়ার করি।</p>\n<h2>নিরাপত্তা</h2>\n<p>তথ্য স্থানান্তরের সময় এনক্রিপ্টেড (HTTPS) থাকে।</p>\n<h2>আপনার তথ্য মুছে ফেলা</h2>\n<p>অ্যাপের ভেতর থেকে আপনার অ্যাকাউন্ট ও তথ্য মুছে ফেলতে পারেন, অথবা <a href=\"delete.html\">অ্যাকাউন্ট মুছে ফেলার পাতায়</a> অনুরোধ করতে পারেন। অনুরোধের ৩০ দিনের মধ্যে আমরা তথ্য মুছে ফেলি। অ্যাপ আনইনস্টল করলে ডিভাইসে সংরক্ষিত তথ্য মুছে যায়।</p>\n<h2>শিশু</h2>\n<p>অ্যাপটি ১৩ বছরের কম বয়সী শিশুদের জন্য নয়, এবং আমরা জেনেশুনে তাদের তথ্য সংগ্রহ করি না।</p>\n<h2>পরিবর্তন</h2>\n<p>আমরা এই নীতি হালনাগাদ করতে পারি এবং যেকোনো পরিবর্তন তারিখসহ এই পাতায় প্রকাশ করব।</p>\n<h2>যোগাযোগ</h2>\n<p>প্রশ্নের জন্য: <a href=\"mailto:biko.dev.app@gmail.com\">biko.dev.app@gmail.com</a></p>"}, "hi": {"title": "गोपनीयता नीति", "app": "«अज़कार और अज़ान» ऐप", "updated": "अंतिम अपडेट: 15 नवंबर 2026", "body": "<p>यह नीति बताती है कि BikoApps द्वारा बनाया गया ऐप «अज़कार और अज़ान» (com.biko.athkar) आपके डेटा को कैसे संभालता है। ऐप बिना खाते के चलता है, और अज़कार व नमाज़ के समय बिना इंटरनेट के उपलब्ध हैं।</p>\n<h2>हम कौन-सा डेटा उपयोग करते हैं</h2>\n<ul>\n<li><b>खाता (वैकल्पिक):</b> अगर आप Google या ईमेल से साइन इन करते हैं, तो आपके पसंदीदा और निजी अज़कार को आपके डिवाइसों में सिंक करने के लिए हम Firebase Authentication के ज़रिए आपका नाम, ईमेल और यूज़र आईडी सहेजते हैं।</li>\n<li><b>आपकी बनाई सामग्री:</b> पसंदीदा, निजी अज़कार और सेटिंग्स आपके डिवाइस पर सहेजी जाती हैं, और साइन इन करने पर Firebase Cloud Firestore के साथ सिंक होती हैं।</li>\n<li><b>सूचनाएँ:</b> रिमाइंडर और घोषणाएँ भेजने के लिए हम Firebase Cloud Messaging का उपयोग करते हैं, जिसके लिए आपके डिवाइस का एक सूचना पहचानकर्ता ज़रूरी है।</li>\n<li><b>स्थान:</b> आपका अनुमानित स्थान केवल आपके डिवाइस पर नमाज़ के समय और क़िबला की दिशा निकालने के लिए उपयोग होता है, हम इसे अपने सर्वर पर नहीं भेजते। शहर का नाम जानने के लिए आपके डिवाइस की लोकेशन सेवा Google की सेवाओं का उपयोग कर सकती है।</li>\n<li><b>विज्ञापन:</b> ऐप Google AdMob के ज़रिए विज्ञापन दिखाता है, जो विज्ञापन दिखाने और मापने के लिए विज्ञापन आईडी, IP पता, डिवाइस जानकारी और विज्ञापन से इंटरैक्शन एकत्र कर सकता है। देखें <a href=\"https://policies.google.com/technologies/ads\">Google की विज्ञापन नीति</a>।</li>\n<li><b>खरीदारी:</b> Google Play के ज़रिए होती है, हमें कोई भुगतान या कार्ड जानकारी नहीं मिलती।</li>\n<li><b>अज़ान की आवाज़ें:</b> अतिरिक्त आवाज़ें GitHub से डाउनलोड होती हैं, जो आपका IP पता लॉग कर सकता है।</li>\n</ul>\n<h2>साझा करना</h2>\n<p>हम आपका डेटा नहीं बेचते। ऐप चलाने के लिए ज़रूरी हद तक केवल ऊपर बताए गए सेवा प्रदाताओं (Google Firebase, Google AdMob, Google Play और GitHub) के साथ साझा करते हैं।</p>\n<h2>सुरक्षा</h2>\n<p>डेटा ट्रांसफ़र के दौरान एन्क्रिप्टेड (HTTPS) रहता है।</p>\n<h2>अपना डेटा हटाना</h2>\n<p>आप ऐप के अंदर से अपना खाता और डेटा हटा सकते हैं, या <a href=\"delete.html\">खाता हटाने वाले पेज</a> पर अनुरोध कर सकते हैं। हम अनुरोध के 30 दिनों के भीतर डेटा हटा देते हैं। ऐप अनइंस्टॉल करने से डिवाइस पर सहेजा डेटा हट जाता है।</p>\n<h2>बच्चे</h2>\n<p>यह ऐप 13 वर्ष से कम उम्र के बच्चों के लिए नहीं है, और हम जानबूझकर उनका डेटा एकत्र नहीं करते।</p>\n<h2>बदलाव</h2>\n<p>हम इस नीति को अपडेट कर सकते हैं और हर बदलाव तारीख के साथ इसी पेज पर प्रकाशित करेंगे।</p>\n<h2>संपर्क</h2>\n<p>प्रश्नों के लिए: <a href=\"mailto:biko.dev.app@gmail.com\">biko.dev.app@gmail.com</a></p>"}, "zh": {"title": "隐私政策", "app": "「赞念与宣礼」应用", "updated": "最后更新：2026年11月15日", "body": "<p>本政策说明由 BikoApps 开发的应用「赞念与宣礼」（com.biko.athkar）如何处理您的数据。该应用无需账户即可使用，赞念内容和礼拜时间均可离线使用。</p>\n<h2>我们处理的数据</h2>\n<ul>\n<li><b>账户（可选）：</b>如果您使用 Google 或电子邮件登录，我们会通过 Firebase Authentication 保存您的姓名、电子邮件地址和用户 ID，以便在您的设备之间同步收藏和个人赞念。</li>\n<li><b>您创建的内容：</b>收藏、个人赞念和设置保存在您的设备上；登录后会与 Firebase Cloud Firestore 同步。</li>\n<li><b>通知：</b>我们使用 Firebase Cloud Messaging 发送提醒和公告，这需要您设备的通知标识符。</li>\n<li><b>位置：</b>您的大致位置仅在您的设备上用于计算礼拜时间和朝向（基卜拉），我们不会将其发送到我们的服务器。您设备的定位服务可能会使用 Google 服务将坐标转换为城市名称。</li>\n<li><b>广告：</b>本应用通过 Google AdMob 展示广告，AdMob 可能会收集广告 ID、IP 地址、设备信息和广告互动数据，用于投放和衡量广告。请参阅 <a href=\"https://policies.google.com/technologies/ads\">Google 广告政策</a>。</li>\n<li><b>购买：</b>通过 Google Play 完成，我们不会获取任何付款或银行卡信息。</li>\n<li><b>宣礼音频：</b>额外的音频从 GitHub 下载，GitHub 可能会记录您的 IP 地址。</li>\n</ul>\n<h2>共享</h2>\n<p>我们不会出售您的数据。我们仅在运行应用所需的范围内，与上述服务提供商（Google Firebase、Google AdMob、Google Play 和 GitHub）共享数据。</p>\n<h2>安全</h2>\n<p>数据在传输过程中经过加密（HTTPS）。</p>\n<h2>删除您的数据</h2>\n<p>您可以在应用内删除您的账户和数据，或在<a href=\"delete.html\">账户删除页面</a>提出请求。我们会在收到请求后 30 天内删除数据。卸载应用会删除保存在设备上的数据。</p>\n<h2>儿童</h2>\n<p>本应用不面向 13 岁以下儿童，我们不会有意收集他们的数据。</p>\n<h2>变更</h2>\n<p>我们可能会更新本政策，任何变更都会连同更新日期发布在本页面。</p>\n<h2>联系我们</h2>\n<p>如有疑问：<a href=\"mailto:biko.dev.app@gmail.com\">biko.dev.app@gmail.com</a></p>"}, "tr": {"title": "Gizlilik Politikası", "app": "«Zikirler ve Ezan» uygulaması", "updated": "Son güncelleme: 15 Kasım 2026", "body": "<p>Bu politika, BikoApps tarafından geliştirilen «Zikirler ve Ezan» (com.biko.athkar) uygulamasının verilerinizi nasıl işlediğini açıklar. Uygulama hesap olmadan çalışır; zikirler ve namaz vakitleri internet olmadan kullanılabilir.</p>\n<h2>İşlediğimiz veriler</h2>\n<ul>\n<li><b>Hesap (isteğe bağlı):</b> Google veya e-posta ile giriş yaparsanız, favorilerinizi ve kişisel zikirlerinizi cihazlarınız arasında eşitlemek için adınızı, e-posta adresinizi ve kullanıcı kimliğinizi Firebase Authentication üzerinden saklarız.</li>\n<li><b>Oluşturduğunuz içerik:</b> Favoriler, kişisel zikirler ve ayarlar cihazınızda saklanır; giriş yaparsanız Firebase Cloud Firestore ile eşitlenir.</li>\n<li><b>Bildirimler:</b> Hatırlatma ve duyuru göndermek için Firebase Cloud Messaging kullanırız; bunun için cihazınıza ait bir bildirim tanımlayıcısı gerekir.</li>\n<li><b>Konum:</b> Yaklaşık konumunuz yalnızca cihazınızda namaz vakitlerini ve kıble yönünü hesaplamak için kullanılır, sunucularımıza gönderilmez. Cihazınızın konum hizmeti, koordinatları şehir adına çevirmek için Google hizmetlerini kullanabilir.</li>\n<li><b>Reklamlar:</b> Uygulama Google AdMob üzerinden reklam gösterir; AdMob reklamları sunmak ve ölçmek için reklam kimliğini, IP adresini, cihaz bilgilerini ve reklam etkileşimlerini toplayabilir. Bkz. <a href=\"https://policies.google.com/technologies/ads\">Google reklam politikası</a>.</li>\n<li><b>Satın almalar:</b> Google Play üzerinden yapılır; ödeme veya kart bilgilerinizi asla almayız.</li>\n<li><b>Ezan sesleri:</b> Ek sesler GitHub'dan indirilir; GitHub IP adresinizi kaydedebilir.</li>\n</ul>\n<h2>Paylaşım</h2>\n<p>Verilerinizi satmayız. Yalnızca uygulamayı çalıştırmak için gerektiği ölçüde yukarıdaki hizmet sağlayıcılarla (Google Firebase, Google AdMob, Google Play ve GitHub) paylaşırız.</p>\n<h2>Güvenlik</h2>\n<p>Veriler aktarım sırasında şifrelenir (HTTPS).</p>\n<h2>Verilerinizi silme</h2>\n<p>Hesabınızı ve verilerinizi uygulama içinden silebilir veya <a href=\"delete.html\">hesap silme sayfasından</a> talep edebilirsiniz. Verileri talepten itibaren 30 gün içinde sileriz. Uygulamayı kaldırmak cihazınızdaki verileri siler.</p>\n<h2>Çocuklar</h2>\n<p>Uygulama 13 yaşından küçük çocuklara yönelik değildir ve bilerek onların verilerini toplamayız.</p>\n<h2>Değişiklikler</h2>\n<p>Bu politikayı güncelleyebiliriz; her değişikliği güncelleme tarihiyle bu sayfada yayınlarız.</p>\n<h2>İletişim</h2>\n<p>Sorularınız için: <a href=\"mailto:biko.dev.app@gmail.com\">biko.dev.app@gmail.com</a></p>"}};
const ORDER = ["ar", "en", "ur", "bn", "hi", "zh", "tr"];
const NAMES = {"ar": "العربية", "en": "English", "ur": "اردو", "bn": "বাংলা", "hi": "हिन्दी", "zh": "中文", "tr": "Türkçe"};
const DIRS = {"ar": "rtl", "en": "ltr", "ur": "rtl", "bn": "ltr", "hi": "ltr", "zh": "ltr", "tr": "ltr"};
function pick(){
  const q = new URLSearchParams(location.search).get('lang');
  if (q && DATA[q]) return q;
  let s=null; try{ s = localStorage.getItem('athkar_lang'); }catch(e){}
  if (s && DATA[s]) return s;
  const n = (navigator.language||'ar').slice(0,2).toLowerCase();
  return DATA[n] ? n : 'ar';
}
function render(l){
  const d = DATA[l];
  document.documentElement.lang = l;
  document.documentElement.dir = DIRS[l];
  document.title = d.title + ' – ' + d.app;
  document.getElementById('doc').innerHTML = '<h1>'+d.title+'</h1><p class="sub">'+d.app+' · '+d.updated+'</p>'+d.body;
  document.querySelectorAll('#langs button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.l===l));
  try{ localStorage.setItem('athkar_lang', l); }catch(e){}
  const u = new URL(location.href); u.searchParams.set('lang', l); history.replaceState(null,'',u);
}
const nav = document.getElementById('langs');
ORDER.forEach(l=>{ const b=document.createElement('button'); b.dataset.l=l; b.textContent=NAMES[l]; b.onclick=()=>render(l); nav.appendChild(b); });
render(pick());
</script>
<noscript><h1>سياسة الخصوصية</h1><p>توضّح هذه السياسة كيف يتعامل تطبيق «اذكر الله - أذكار وأذان» (com.biko.athkar)، من تطوير BikoApps، مع بياناتك. يعمل التطبيق دون حساب، ومحتوى الأذكار ومواقيت الصلاة متاحان دون اتصال بالإنترنت.</p>
<h2>البيانات التي نتعامل معها</h2>
<ul>
<li><b>الحساب (اختياري):</b> إذا سجّلت الدخول بحساب Google أو بالبريد الإلكتروني، نحفظ اسمك وبريدك ومعرّف المستخدم عبر Firebase Authentication، لمزامنة مفضلتك وأذكارك الخاصة بين أجهزتك.</li>
<li><b>المحتوى الذي تنشئه:</b> المفضلة والأذكار الخاصة والإعدادات تُحفظ على جهازك، وإذا سجّلت الدخول تُزامن مع Firebase Cloud Firestore.</li>
<li><b>الإشعارات:</b> نستخدم Firebase Cloud Messaging لإرسال التذكيرات والتنبيهات، ويتطلب ذلك معرّفاً خاصاً بجهازك للإشعارات.</li>
<li><b>الموقع:</b> يُستخدم موقعك التقريبي على جهازك فقط لحساب مواقيت الصلاة واتجاه القبلة، ولا نرسله إلى خوادمنا. وقد تستخدم خدمة الموقع في جهازك خدمات Google لتحويل الإحداثيات إلى اسم المدينة.</li>
<li><b>الإعلانات:</b> يعرض التطبيق إعلانات عبر Google AdMob، وقد تجمع AdMob معرّف الإعلانات وعنوان IP ومعلومات الجهاز والتفاعل مع الإعلانات لعرضها وقياسها. راجع <a href="https://policies.google.com/technologies/ads">سياسة Google للإعلانات</a>.</li>
<li><b>المشتريات:</b> تتم عبر Google Play، ولا نستلم أي بيانات دفع أو بطاقات.</li>
<li><b>أصوات الأذان:</b> تُنزَّل الأصوات الإضافية من GitHub، وقد يسجّل GitHub عنوان IP عند التنزيل.</li>
</ul>
<h2>المشاركة</h2>
<p>لا نبيع بياناتك. نشاركها فقط مع مزوّدي الخدمات المذكورين أعلاه (Google Firebase وGoogle AdMob وGoogle Play وGitHub) بالقدر اللازم لتشغيل التطبيق.</p>
<h2>الأمان</h2>
